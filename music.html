<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spotify Client</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#000;
    --panel:#0d0d0d;
    --panel-2:#161616;
    --line: rgba(255,255,255,0.12);
    --line-strong: rgba(255,255,255,0.24);
    --text:#ffffff;
    --text-dim:#a6a6a6;
    --text-faint:#6b6b6b;
    --danger:#ff6b6b;
    --radius-lg:24px;
    --radius-md:16px;
    --radius-sm:10px;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; background:var(--bg); color:var(--text); font-family:'Nunito',sans-serif; font-weight:600; -webkit-font-smoothing:antialiased; }
  h1,h2,h3,h4{ font-family:'Fredoka',sans-serif; font-weight:600; margin:0; }
  code,.mono{ font-family:'JetBrains Mono',monospace; }
  ::selection{ background:#fff; color:#000; }
  a{ color:inherit; }
  button{ font-family:inherit; }
  a:focus-visible, button:focus-visible, input:focus-visible{ outline:2px solid #fff; outline-offset:2px; }
  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-thumb{ background:#2a2a2a; border-radius:999px; }
  ::-webkit-scrollbar-track{ background:transparent; }

  .hidden{ display:none !important; }

  /* ---------- gate ---------- */
  #gate{
    min-height:100vh; display:flex; align-items:center; justify-content:center;
  }
  .gate-card{
    width:min(400px, 90vw); padding:36px 32px; border-radius:var(--radius-lg);
    background:var(--panel); border:2px solid var(--line-strong); text-align:left;
  }
  .gate-card .eyebrow{
    display:inline-block; font-family:'JetBrains Mono',monospace; font-size:11px; text-transform:uppercase;
    letter-spacing:0.5px; color:var(--text-dim); border:1.5px solid var(--line-strong); padding:5px 14px; border-radius:999px; margin-bottom:16px;
  }
  .gate-card h1{ font-size:30px; margin-bottom:10px; }
  .gate-card p{ color:var(--text-dim); font-size:15px; line-height:1.55; margin:0 0 22px; }
  .gate-card .notice{ margin-top:14px; font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--text-faint); line-height:1.6; word-break:break-all; }
  .gate-card .error{ color:var(--danger); font-size:13px; margin-top:12px; }

  .pill{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    padding:13px 22px; border-radius:999px; border:2px solid #fff; background:transparent; color:#fff;
    font-family:'Fredoka',sans-serif; font-weight:600; font-size:15px; cursor:pointer;
    transition:transform .12s ease, background .12s ease, color .12s ease; white-space:nowrap;
  }
  .pill.solid{ background:#fff; color:#000; }
  .pill.solid:hover{ background:transparent; color:#fff; }
  .pill:hover{ transform:translateY(-1px); }
  .pill.full{ width:100%; }
  .pill.sm{ padding:8px 16px; font-size:13px; }

  /* ---------- app shell ---------- */
  #app{ display:none; height:100vh; grid-template-rows:64px 1fr 88px; grid-template-columns:240px 1fr; grid-template-areas:"top top" "side main" "player player"; }
  #app.show{ display:grid; }

  .topbar{
    grid-area:top; display:flex; align-items:center; gap:16px; padding:0 22px;
    border-bottom:1px solid var(--line); background:var(--panel);
  }
  .search-wrap{ flex:1; max-width:520px; position:relative; }
  .search-wrap svg{ position:absolute; left:14px; top:50%; transform:translateY(-50%); width:16px; height:16px; fill:var(--text-faint); }
  #searchInput{
    width:100%; background:var(--panel-2); border:1.5px solid var(--line); color:#fff;
    padding:11px 16px 11px 38px; border-radius:999px; font-family:'Nunito',sans-serif; font-weight:700; font-size:14.5px;
  }
  #searchInput::placeholder{ color:var(--text-faint); font-weight:600; }
  #searchInput:focus{ outline:none; border-color:#fff; }
  .topbar-right{ display:flex; align-items:center; gap:10px; }
  #userTag{ font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--text-dim); }

  .sidebar{
    grid-area:side; background:var(--panel); border-right:1px solid var(--line);
    padding:18px 12px; overflow-y:auto; display:flex; flex-direction:column; gap:4px;
  }
  .nav-item{
    display:flex; align-items:center; gap:12px; padding:10px 14px; border-radius:999px;
    background:none; border:none; color:var(--text-dim); font-family:'Fredoka',sans-serif; font-weight:600; font-size:14.5px;
    cursor:pointer; text-align:left; width:100%;
  }
  .nav-item svg{ width:18px; height:18px; fill:currentColor; flex:none; }
  .nav-item:hover{ color:#fff; background:var(--panel-2); }
  .nav-item.active{ color:#000; background:#fff; }
  .sidebar-divider{ height:1px; background:var(--line); margin:12px 6px; }
  .sidebar-label{
    font-family:'JetBrains Mono',monospace; font-size:10.5px; text-transform:uppercase; letter-spacing:0.5px;
    color:var(--text-faint); padding:8px 14px 4px;
  }
  .playlist-item{
    display:block; width:100%; text-align:left; background:none; border:none; color:var(--text-dim);
    padding:8px 14px; border-radius:10px; font-size:14px; font-weight:700; cursor:pointer;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .playlist-item:hover{ color:#fff; background:var(--panel-2); }
  .playlist-item.active{ color:#fff; background:var(--panel-2); }

  .main{ grid-area:main; overflow-y:auto; padding:28px 32px 40px; }
  .view-title{ font-size:30px; margin-bottom:6px; }
  .view-sub{ color:var(--text-dim); font-size:14.5px; margin-bottom:26px; }
  .section-label{
    font-family:'JetBrains Mono',monospace; font-size:11.5px; text-transform:uppercase; letter-spacing:0.5px;
    color:var(--text-faint); margin:28px 0 12px;
  }
  .section-label:first-child{ margin-top:0; }

  .card-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); gap:16px; }
  .art-card{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-md); padding:12px;
    cursor:pointer; transition:background .15s ease, transform .15s ease;
  }
  .art-card:hover{ background:var(--panel-2); transform:translateY(-2px); }
  .art-card img{ width:100%; aspect-ratio:1; object-fit:cover; border-radius:var(--radius-sm); background:var(--panel-2); display:block; margin-bottom:10px; }
  .art-card .name{ font-family:'Fredoka',sans-serif; font-size:14.5px; font-weight:600; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .art-card .sub{ font-size:12.5px; color:var(--text-faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px; }
  .art-card.round img{ border-radius:999px; }

  .track-row{
    display:flex; align-items:center; gap:14px; padding:9px 10px; border-radius:10px;
  }
  .track-row:hover{ background:var(--panel-2); }
  .track-row .idx{ width:22px; text-align:center; color:var(--text-faint); font-family:'JetBrains Mono',monospace; font-size:12.5px; flex:none; }
  .track-row img{ width:44px; height:44px; border-radius:8px; object-fit:cover; background:var(--panel-2); flex:none; }
  .track-row .t-main{ min-width:0; flex:1; }
  .track-row .t-name{ font-family:'Nunito',sans-serif; font-weight:700; font-size:14.5px; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .track-row .t-artist{ font-size:12.5px; color:var(--text-faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:1px; }
  .track-row .t-dur{ font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--text-faint); flex:none; width:44px; text-align:right; }
  .row-btn{
    background:none; border:none; color:var(--text-dim); cursor:pointer; padding:6px; flex:none;
    display:flex; align-items:center; justify-content:center; opacity:0.75;
  }
  .row-btn:hover{ opacity:1; color:#fff; }
  .row-btn svg{ width:17px; height:17px; fill:currentColor; }
  .row-btn.liked{ color:#fff; opacity:1; }
  .row-play{
    background:#fff; color:#000; border:none; border-radius:50%; width:32px; height:32px; flex:none;
    display:flex; align-items:center; justify-content:center; cursor:pointer; opacity:0; transition:opacity .1s ease;
  }
  .track-row:hover .row-play{ opacity:1; }
  .row-play svg{ width:13px; height:13px; fill:#000; }

  .empty-state{ color:var(--text-faint); font-size:14.5px; padding:30px 6px; }
  .load-more-wrap{ margin-top:18px; }

  .playlist-header{ display:flex; gap:22px; align-items:flex-end; margin-bottom:28px; }
  .playlist-header img{ width:160px; height:160px; border-radius:var(--radius-md); object-fit:cover; background:var(--panel-2); flex:none; }
  .playlist-header .ph-meta{ font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--text-faint); margin-top:8px; text-transform:uppercase; letter-spacing:0.4px; }

  /* ---------- now playing bar ---------- */
  .player-bar{
    grid-area:player; background:var(--panel); border-top:1px solid var(--line);
    display:flex; align-items:center; gap:20px; padding:0 22px;
  }
  .np-meta{ display:flex; align-items:center; gap:12px; width:280px; min-width:0; }
  .np-meta img{ width:54px; height:54px; border-radius:8px; object-fit:cover; background:var(--panel-2); flex:none; }
  .np-text{ min-width:0; }
  .np-text .np-name{ font-family:'Fredoka',sans-serif; font-size:14px; font-weight:600; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .np-text .np-artist{ font-size:12.5px; color:var(--text-faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px; }

  .np-center{ flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; max-width:640px; margin:0 auto; }
  .np-controls{ display:flex; align-items:center; gap:20px; }
  .np-ctrl{ background:none; border:none; color:#fff; cursor:pointer; opacity:0.8; display:flex; align-items:center; }
  .np-ctrl:hover{ opacity:1; }
  .np-ctrl svg{ width:18px; height:18px; fill:currentColor; }
  .np-ctrl.play{ width:34px; height:34px; border-radius:50%; background:#fff; color:#000; justify-content:center; opacity:1; }
  .np-ctrl.play svg{ width:14px; height:14px; fill:#000; }
  .np-progress{ display:flex; align-items:center; gap:8px; width:100%; font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--text-faint); }
  .np-bar-track{ flex:1; height:4px; border-radius:999px; background:var(--panel-2); position:relative; cursor:pointer; }
  .np-bar-fill{ position:absolute; left:0; top:0; bottom:0; border-radius:999px; background:#fff; width:0%; }

  .np-right{ width:200px; display:flex; align-items:center; justify-content:flex-end; gap:10px; }
  .np-badge{
    font-family:'JetBrains Mono',monospace; font-size:9.5px; text-transform:uppercase; letter-spacing:0.4px;
    color:var(--text-faint); border:1px solid var(--line); padding:4px 10px; border-radius:999px;
  }
  input[type="range"].vol{ -webkit-appearance:none; width:90px; height:3px; border-radius:999px; background:var(--panel-2); outline:none; }
  input[type="range"].vol::-webkit-slider-thumb{ -webkit-appearance:none; width:11px; height:11px; border-radius:50%; background:#fff; cursor:pointer; }
  input[type="range"].vol::-moz-range-thumb{ width:11px; height:11px; border-radius:50%; border:none; background:#fff; cursor:pointer; }

  .toast{
    position:fixed; bottom:100px; left:50%; transform:translateX(-50%);
    background:#fff; color:#000; padding:12px 24px; border-radius:999px; font-family:'Fredoka',sans-serif; font-weight:600; font-size:14px;
    z-index:200; opacity:0; pointer-events:none; transition:opacity .2s ease, transform .2s ease;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(-6px); }

  @media (max-width:820px){
    #app{ grid-template-columns:0 1fr; }
    .sidebar{ display:none; }
    .np-meta{ width:auto; }
    .np-right{ width:auto; }
  }
</style>
</head>
<body>

<!-- ---------- Login gate ---------- -->
<div id="gate">
  <div class="gate-card">
    <span class="eyebrow">Spotify</span>
    <h1>Sign in</h1>
    <p id="gateBody">Connect your Spotify account to search, browse your library, and build a queue. Playback streams in-browser for Premium accounts; free accounts open tracks in Spotify to listen.</p>
    <button class="pill solid full" id="connectBtn">Connect Spotify</button>
    <div class="error hidden" id="gateError"></div>
    <div class="notice hidden" id="setupNotice"></div>
  </div>
</div>

<!-- ---------- App shell ---------- -->
<div id="app">
  <div class="topbar">
    <div class="search-wrap">
      <svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><line x1="15.5" y1="15.5" x2="21" y2="21" stroke="currentColor" stroke-width="2"/></svg>
      <input type="text" id="searchInput" placeholder="Search songs, artists, albums, playlists…">
    </div>
    <div class="topbar-right">
      <span id="userTag" class="mono"></span>
      <button class="pill sm" id="logoutBtn">Disconnect</button>
    </div>
  </div>

  <div class="sidebar">
    <button class="nav-item active" data-view="search">
      <svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><line x1="15.5" y1="15.5" x2="21" y2="21" stroke="currentColor" stroke-width="2"/></svg>
      Search
    </button>
    <button class="nav-item" data-view="liked">
      <svg viewBox="0 0 24 24"><path d="M12 21s-7-4.35-9.5-8.9C.6 8.4 2 5 5.4 5c1.9 0 3.3 1 4.1 2.4C10.3 6 11.7 5 13.6 5 17 5 18.4 8.4 21.5 12.1 19 16.65 12 21 12 21z"/></svg>
      Liked Songs
    </button>
    <button class="nav-item" data-view="queue">
      <svg viewBox="0 0 24 24"><line x1="4" y1="6" x2="16" y2="6" stroke="currentColor" stroke-width="2"/><line x1="4" y1="12" x2="16" y2="12" stroke="currentColor" stroke-width="2"/><line x1="4" y1="18" x2="12" y2="18" stroke="currentColor" stroke-width="2"/><circle cx="19" cy="16" r="2.4" fill="none" stroke="currentColor" stroke-width="2"/><line x1="19" y1="6" x2="19" y2="13.6" stroke="currentColor" stroke-width="2"/></svg>
      Queue
    </button>
    <div class="sidebar-divider"></div>
    <div class="sidebar-label">Your Playlists</div>
    <div id="playlistList"></div>
  </div>

  <div class="main" id="main"></div>

  <div class="player-bar">
    <div class="np-meta">
      <img id="npArt" src="" alt="">
      <div class="np-text">
        <div class="np-name" id="npName">Nothing playing</div>
        <div class="np-artist" id="npArtist"></div>
      </div>
    </div>
    <div class="np-center">
      <div class="np-controls">
        <button class="np-ctrl" id="prevBtn" title="Previous"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
        <button class="np-ctrl play" id="playBtn" title="Play/Pause"><svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
        <button class="np-ctrl" id="nextBtn" title="Next"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 6l8.5 6L6 18z"/></svg></button>
      </div>
      <div class="np-progress">
        <span id="elapsed">0:00</span>
        <div class="np-bar-track" id="barTrack"><div class="np-bar-fill" id="barFill"></div></div>
        <span id="duration">0:00</span>
      </div>
    </div>
    <div class="np-right">
      <span class="np-badge" id="acctBadge"></span>
      <input type="range" class="vol" id="volSlider" min="0" max="100" value="50">
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  // ======================================================================
  // SITE OWNER SETUP:
  // 1. Create an app at https://developer.spotify.com/dashboard
  // 2. Paste its Client ID below.
  // 3. Add this exact page URL as a Redirect URI in the app settings.
  // ======================================================================
  const CLIENT_ID = '0b415bb2e2964029bd1f996cbbebfc88';

  const REDIRECT_URI = window.location.origin + window.location.pathname;
  const SCOPES = [
    'streaming','user-read-email','user-read-private',
    'user-read-playback-state','user-modify-playback-state','user-read-currently-playing',
    'user-library-read','user-library-modify',
    'playlist-read-private','playlist-read-collaborative'
  ].join(' ');

  const LS = { verifier:'sp_pkce_verifier', accessToken:'sp_access_token', refreshToken:'sp_refresh_token', expiresAt:'sp_expires_at' };

  const $ = (id) => document.getElementById(id);
  const gate = $('gate'), app = $('app');

  function toast(msg){
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toast._h);
    toast._h = setTimeout(() => t.classList.remove('show'), 2400);
  }

  // ---------------- PKCE ----------------
  function randomString(len){
    const chars='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
    let out=''; const r=crypto.getRandomValues(new Uint8Array(len));
    for(let i=0;i<len;i++) out+=chars[r[i]%chars.length];
    return out;
  }
  async function sha256(s){ return crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); }
  function b64url(buf){
    let s=''; const b=new Uint8Array(buf);
    for(let i=0;i<b.byteLength;i++) s+=String.fromCharCode(b[i]);
    return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  }

  function showGateError(msg){ const e=$('gateError'); e.textContent=msg; e.classList.remove('hidden'); }

  async function beginLogin(){
    $('gateError').classList.add('hidden');
    if(!CLIENT_ID || CLIENT_ID==='YOUR_SPOTIFY_CLIENT_ID_HERE'){ showGateError('Site not set up yet — add a Spotify Client ID in the code.'); return; }
    if(!window.isSecureContext){ showGateError('This page needs https:// (or http://localhost) to log in — file:// pages are blocked by the browser.'); return; }
    try{
      const verifier = randomString(64);
      localStorage.setItem(LS.verifier, verifier);
      const challenge = b64url(await sha256(verifier));
      const params = new URLSearchParams({
        response_type:'code', client_id:CLIENT_ID, scope:SCOPES,
        code_challenge_method:'S256', code_challenge:challenge, redirect_uri:REDIRECT_URI
      });
      window.location = 'https://accounts.spotify.com/authorize?' + params.toString();
    }catch(e){ showGateError('Could not start login: ' + e.message); }
  }

  async function exchangeCode(code){
    const verifier = localStorage.getItem(LS.verifier);
    const body = new URLSearchParams({ grant_type:'authorization_code', code, redirect_uri:REDIRECT_URI, client_id:CLIENT_ID, code_verifier:verifier });
    const res = await fetch('https://accounts.spotify.com/api/token', { method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body });
    if(!res.ok) throw new Error('token exchange failed');
    storeTokens(await res.json());
  }
  async function refreshToken(){
    const rt = localStorage.getItem(LS.refreshToken);
    if(!rt) return false;
    const body = new URLSearchParams({ grant_type:'refresh_token', refresh_token:rt, client_id:CLIENT_ID });
    const res = await fetch('https://accounts.spotify.com/api/token', { method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body });
    if(!res.ok) return false;
    storeTokens(await res.json());
    return true;
  }
  function storeTokens(d){
    localStorage.setItem(LS.accessToken, d.access_token);
    if(d.refresh_token) localStorage.setItem(LS.refreshToken, d.refresh_token);
    localStorage.setItem(LS.expiresAt, String(Date.now() + (d.expires_in-60)*1000));
  }
  async function getToken(){
    const exp = Number(localStorage.getItem(LS.expiresAt) || 0);
    if(Date.now() > exp){ const ok = await refreshToken(); if(!ok) return null; }
    return localStorage.getItem(LS.accessToken);
  }
  function disconnect(){ Object.values(LS).forEach(k=>localStorage.removeItem(k)); window.location = REDIRECT_URI; }

  // ---------------- API helper ----------------
  async function api(path, opts={}){
    const token = await getToken();
    if(!token) throw new Error('not authed');
    const res = await fetch('https://api.spotify.com/v1' + path, {
      ...opts,
      headers:{ 'Authorization':'Bearer ' + token, 'Content-Type':'application/json', ...(opts.headers||{}) }
    });
    if(res.status === 204) return null;
    const text = await res.text();
    const data = text ? JSON.parse(text) : null;
    if(!res.ok){ throw new Error((data && data.error && data.error.message) || res.statusText); }
    return data;
  }

  function fmtTime(ms){
    const t=Math.floor(ms/1000), m=Math.floor(t/60), s=t%60;
    return m+':'+String(s).padStart(2,'0');
  }
  function esc(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  // ---------------- Playback state ----------------
  let player = null, deviceId = null, isPremium = false;
  let localQueue = [];      // used for free accounts (display-only)
  let progressTimer = null;
  let curTrack = null, curPositionMs = 0, curDurationMs = 0, curPlaying = false;
  let likedCache = new Map();

  function loadSdk(){
    return new Promise((resolve)=>{
      if(window.Spotify){ resolve(); return; }
      const s = document.createElement('script');
      s.src = 'https://sdk.scdn.co/spotify-player.js';
      s.onload = () => { const c = setInterval(()=>{ if(window.Spotify){ clearInterval(c); resolve(); } },50); };
      document.head.appendChild(s);
    });
  }

  async function initPlayer(){
    await loadSdk();
    player = new Spotify.Player({
      name: 'Browser Spotify Client',
      getOAuthToken: async cb => cb(await getToken()),
      volume: 0.5
    });
    player.addListener('ready', ({device_id}) => { deviceId = device_id; isPremium = true; $('acctBadge').textContent = 'Premium'; });
    player.addListener('not_ready', () => {});
    player.addListener('player_state_changed', (state) => {
      if(!state) return;
      curTrack = state.track_window.current_track;
      curPlaying = !state.paused;
      curPositionMs = state.position;
      curDurationMs = state.duration;
      renderNowPlaying();
      restartProgressTimer();
      renderQueueViewIfActive(state.track_window.next_tracks || []);
    });
    player.addListener('initialization_error', ({message}) => toast('Playback init error: ' + message));
    player.addListener('authentication_error', () => { disconnect(); });
    player.addListener('account_error', () => {
      isPremium = false;
      $('acctBadge').textContent = 'Free — opens in Spotify';
    });
    await player.connect();
  }

  function restartProgressTimer(){
    if(progressTimer) clearInterval(progressTimer);
    progressTimer = setInterval(()=>{
      if(!curPlaying) return;
      curPositionMs = Math.min(curPositionMs + 500, curDurationMs);
      updateBar();
    },500);
  }
  function updateBar(){
    const pct = curDurationMs ? (curPositionMs/curDurationMs)*100 : 0;
    $('barFill').style.width = pct + '%';
    $('elapsed').textContent = fmtTime(curPositionMs);
  }
  function renderNowPlaying(){
    if(!curTrack) return;
    $('npName').textContent = curTrack.name;
    $('npArtist').textContent = curTrack.artists.map(a=>a.name).join(', ');
    $('npArt').src = curTrack.album.images[0] ? curTrack.album.images[0].url : '';
    $('duration').textContent = fmtTime(curDurationMs);
    $('playIcon').innerHTML = curPlaying ? '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>' : '<path d="M8 5v14l11-7z"/>';
    updateBar();
  }

  function trackUri(id){ return 'spotify:track:' + id; }
  function openInSpotify(track){
    const url = (track.external_urls && track.external_urls.spotify) || ('https://open.spotify.com/track/' + track.id);
    window.open(url, '_blank');
  }

  async function playFromUris(uris, index){
    if(isPremium && deviceId){
      try{
        await api('/me/player/play?device_id=' + deviceId, { method:'PUT', body: JSON.stringify({ uris: uris.slice(index) }) });
      }catch(e){ toast('Could not start playback: ' + e.message); }
    } else {
      const track = uris._tracks ? uris._tracks[index] : null;
      if(track) openInSpotify(track);
      else toast('Free account — open the track in Spotify to listen.');
    }
  }
  async function playContext(contextUri, index){
    if(isPremium && deviceId){
      try{
        await api('/me/player/play?device_id=' + deviceId, { method:'PUT', body: JSON.stringify({ context_uri: contextUri, offset:{position:index} }) });
      }catch(e){ toast('Could not start playback: ' + e.message); }
    } else {
      toast('Free account — open a track directly in Spotify to listen.');
    }
  }
  async function playSingleTrack(track){
    if(isPremium && deviceId){
      try{ await api('/me/player/play?device_id=' + deviceId, { method:'PUT', body: JSON.stringify({ uris:[trackUri(track.id)] }) }); }
      catch(e){ toast('Could not start playback: ' + e.message); }
    } else {
      openInSpotify(track);
    }
  }

  function addToQueue(track){
    if(isPremium && deviceId){
      api('/me/player/queue?uri=' + encodeURIComponent(trackUri(track.id)) + '&device_id=' + deviceId, { method:'POST' })
        .then(()=>toast('Added to queue'))
        .catch(e=>toast('Could not queue: ' + e.message));
    } else {
      localQueue.push(track);
      toast('Added to your list');
      if(currentView === 'queue') renderQueueView();
    }
  }

  async function toggleLike(track, btn){
    const liked = likedCache.get(track.id);
    try{
      if(liked){
        await api('/me/tracks?ids=' + track.id, { method:'DELETE' });
        likedCache.set(track.id, false);
      } else {
        await api('/me/tracks?ids=' + track.id, { method:'PUT' });
        likedCache.set(track.id, true);
      }
      btn.classList.toggle('liked', !liked);
    }catch(e){ toast('Could not update Liked Songs: ' + e.message); }
  }

  async function checkLiked(ids){
    if(!ids.length) return;
    try{
      const res = await api('/me/tracks/contains?ids=' + ids.join(','));
      ids.forEach((id,i)=>likedCache.set(id, !!res[i]));
    }catch(e){}
  }

  function heartIcon(filled){
    return filled
      ? '<svg viewBox="0 0 24 24"><path d="M12 21s-7-4.35-9.5-8.9C.6 8.4 2 5 5.4 5c1.9 0 3.3 1 4.1 2.4C10.3 6 11.7 5 13.6 5 17 5 18.4 8.4 21.5 12.1 19 16.65 12 21 12 21z"/></svg>'
      : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 21s-7-4.35-9.5-8.9C.6 8.4 2 5 5.4 5c1.9 0 3.3 1 4.1 2.4C10.3 6 11.7 5 13.6 5 17 5 18.4 8.4 21.5 12.1 19 16.65 12 21 12 21z"/></svg>';
  }

  // ---------------- Rendering: track rows ----------------
  let renderedLists = {}; // listId -> {uris:[...], tracks:[...], contextUri?}
  let listCounter = 0;

  function trackRowHtml(track, idx, listId){
    const img = track.album && track.album.images && track.album.images.length ? track.album.images[track.album.images.length-1].url : '';
    const artists = (track.artists||[]).map(a=>a.name).join(', ');
    const liked = likedCache.get(track.id) || false;
    return `<div class="track-row" data-list="${listId}" data-idx="${idx}">
      <span class="idx">${idx+1}</span>
      <button class="row-play" data-action="play">${'<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>'}</button>
      <img src="${img}" alt="">
      <div class="t-main">
        <div class="t-name">${esc(track.name)}</div>
        <div class="t-artist">${esc(artists)}</div>
      </div>
      <button class="row-btn ${liked?'liked':''}" data-action="like" title="Save to Liked Songs">${heartIcon(liked)}</button>
      <button class="row-btn" data-action="queue" title="Add to queue"><svg viewBox="0 0 24 24"><line x1="4" y1="6" x2="16" y2="6" stroke="currentColor" stroke-width="2"/><line x1="4" y1="12" x2="16" y2="12" stroke="currentColor" stroke-width="2"/><line x1="4" y1="18" x2="12" y2="18" stroke="currentColor" stroke-width="2"/><circle cx="19" cy="16" r="2.2" fill="none" stroke="currentColor" stroke-width="2"/><line x1="19" y1="6" x2="19" y2="13.6" stroke="currentColor" stroke-width="2"/></svg></button>
      <span class="t-dur">${fmtTime(track.duration_ms||0)}</span>
    </div>`;
  }

  function registerList(tracks, contextUri){
    const id = 'l' + (++listCounter);
    renderedLists[id] = { tracks, contextUri: contextUri || null };
    checkLiked(tracks.map(t=>t.id).filter(Boolean).slice(0,50));
    return id;
  }

  function wireTrackRowEvents(container){
    container.addEventListener('click', (e) => {
      const rowBtn = e.target.closest('[data-action]');
      const row = e.target.closest('.track-row');
      if(!row) return;
      const listId = row.dataset.list;
      const idx = Number(row.dataset.idx);
      const list = renderedLists[listId];
      if(!list) return;
      const track = list.tracks[idx];

      if(rowBtn && rowBtn.dataset.action === 'like'){ toggleLike(track, rowBtn); return; }
      if(rowBtn && rowBtn.dataset.action === 'queue'){ addToQueue(track); return; }

      // play (either the play button or the row itself)
      if(list.contextUri){
        playContext(list.contextUri, idx);
      } else {
        const uris = list.tracks.map(t=>trackUri(t.id));
        uris._tracks = list.tracks;
        playFromUris(uris, idx);
      }
    });
  }

  // ---------------- Views ----------------
  let currentView = 'search';
  const main = $('main');

  function setActiveNav(view){
    document.querySelectorAll('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.view === view));
    document.querySelectorAll('.playlist-item').forEach(n => n.classList.remove('active'));
  }

  function renderSearchEmpty(){
    main.innerHTML = `<h2 class="view-title">Search</h2><p class="view-sub">Find songs, artists, albums, and playlists.</p><div class="empty-state">Start typing above to search.</div>`;
  }

  async function runSearch(q){
    if(!q){ renderSearchEmpty(); return; }
    main.innerHTML = `<h2 class="view-title">Results for "${esc(q)}"</h2><div class="empty-state">Searching…</div>`;
    try{
      const data = await api('/search?type=track,artist,album,playlist&limit=8&q=' + encodeURIComponent(q));
      let html = `<h2 class="view-title">Results for "${esc(q)}"</h2>`;

      if(data.tracks && data.tracks.items.length){
        const listId = registerList(data.tracks.items, null);
        html += `<div class="section-label">Songs</div><div id="${listId}-wrap">` +
          data.tracks.items.map((t,i)=>trackRowHtml(t,i,listId)).join('') + `</div>`;
      }
      if(data.artists && data.artists.items.length){
        html += `<div class="section-label">Artists</div><div class="card-grid">` +
          data.artists.items.map(a => `<div class="art-card round" data-artist="${a.id}">
            <img src="${a.images[a.images.length-1] ? a.images[a.images.length-1].url : ''}">
            <div class="name">${esc(a.name)}</div><div class="sub">Artist</div></div>`).join('') + `</div>`;
      }
      if(data.albums && data.albums.items.length){
        html += `<div class="section-label">Albums</div><div class="card-grid">` +
          data.albums.items.map(al => `<div class="art-card" data-album="${al.id}">
            <img src="${al.images[al.images.length-1] ? al.images[al.images.length-1].url : ''}">
            <div class="name">${esc(al.name)}</div><div class="sub">${esc((al.artists||[]).map(a=>a.name).join(', '))}</div></div>`).join('') + `</div>`;
      }
      if(data.playlists && data.playlists.items.length){
        const pls = data.playlists.items.filter(Boolean);
        html += `<div class="section-label">Playlists</div><div class="card-grid">` +
          pls.map(p => `<div class="art-card" data-playlist="${p.id}">
            <img src="${p.images && p.images[0] ? p.images[0].url : ''}">
            <div class="name">${esc(p.name)}</div><div class="sub">By ${esc(p.owner ? p.owner.display_name : '')}</div></div>`).join('') + `</div>`;
      }
      if(!(data.tracks&&data.tracks.items.length) && !(data.artists&&data.artists.items.length) && !(data.albums&&data.albums.items.length) && !(data.playlists&&data.playlists.items.length)){
        html += `<div class="empty-state">No results.</div>`;
      }
      main.innerHTML = html;
      wireTrackRowEvents(main);
      main.querySelectorAll('[data-artist]').forEach(el => el.addEventListener('click', () => openArtist(el.dataset.artist)));
      main.querySelectorAll('[data-album]').forEach(el => el.addEventListener('click', () => openAlbum(el.dataset.album)));
      main.querySelectorAll('[data-playlist]').forEach(el => el.addEventListener('click', () => openPlaylist(el.dataset.playlist)));
    }catch(e){
      main.innerHTML = `<div class="empty-state">Search failed: ${esc(e.message)}</div>`;
    }
  }

  async function openArtist(id){
    setActiveNav(null);
    main.innerHTML = `<div class="empty-state">Loading artist…</div>`;
    try{
      const [artist, top] = await Promise.all([
        api('/artists/' + id),
        api('/artists/' + id + '/top-tracks?market=from_token')
      ]);
      const listId = registerList(top.tracks, null);
      main.innerHTML = `<div class="playlist-header">
          <img src="${artist.images[0] ? artist.images[0].url : ''}" style="border-radius:999px;">
          <div><div class="mono ph-meta">Artist</div><h1 class="view-title">${esc(artist.name)}</h1></div>
        </div>
        <div class="section-label">Popular</div>` + top.tracks.map((t,i)=>trackRowHtml(t,i,listId)).join('');
      wireTrackRowEvents(main);
    }catch(e){ main.innerHTML = `<div class="empty-state">Could not load artist: ${esc(e.message)}</div>`; }
  }

  async function openAlbum(id){
    setActiveNav(null);
    main.innerHTML = `<div class="empty-state">Loading album…</div>`;
    try{
      const album = await api('/albums/' + id);
      const tracks = album.tracks.items.map(t => ({ ...t, album: album }));
      const listId = registerList(tracks, album.uri);
      main.innerHTML = `<div class="playlist-header">
          <img src="${album.images[0] ? album.images[0].url : ''}">
          <div><div class="mono ph-meta">Album</div><h1 class="view-title">${esc(album.name)}</h1>
          <p class="view-sub">${esc((album.artists||[]).map(a=>a.name).join(', '))}</p></div>
        </div>` + tracks.map((t,i)=>trackRowHtml(t,i,listId)).join('');
      wireTrackRowEvents(main);
    }catch(e){ main.innerHTML = `<div class="empty-state">Could not load album: ${esc(e.message)}</div>`; }
  }

  async function openPlaylist(id){
    setActiveNav(null);
    document.querySelectorAll('.playlist-item').forEach(n => n.classList.toggle('active', n.dataset.id === id));
    main.innerHTML = `<div class="empty-state">Loading playlist…</div>`;
    try{
      const pl = await api('/playlists/' + id);
      const tracks = pl.tracks.items.map(it => it.track).filter(Boolean);
      const listId = registerList(tracks, pl.uri);
      main.innerHTML = `<div class="playlist-header">
          <img src="${pl.images && pl.images[0] ? pl.images[0].url : ''}">
          <div><div class="mono ph-meta">Playlist</div><h1 class="view-title">${esc(pl.name)}</h1>
          <p class="view-sub">${pl.tracks.total} songs</p></div>
        </div>` + tracks.map((t,i)=>trackRowHtml(t,i,listId)).join('');
      wireTrackRowEvents(main);
    }catch(e){ main.innerHTML = `<div class="empty-state">Could not load playlist: ${esc(e.message)}</div>`; }
  }

  let likedOffset = 0;
  async function openLiked(reset){
    setActiveNav('liked');
    if(reset !== false) likedOffset = 0;
    if(likedOffset === 0) main.innerHTML = `<h2 class="view-title">Liked Songs</h2><div class="empty-state">Loading…</div>`;
    try{
      const data = await api('/me/tracks?limit=50&offset=' + likedOffset);
      const tracks = data.items.map(it => it.track);
      tracks.forEach(t => likedCache.set(t.id, true));
      const listId = registerList(tracks, null);
      const rows = tracks.map((t,i)=>trackRowHtml(t,i,listId)).join('');
      if(likedOffset === 0){
        main.innerHTML = `<h2 class="view-title">Liked Songs</h2><p class="view-sub">${data.total} songs</p><div id="likedRows">${rows}</div><div class="load-more-wrap"></div>`;
      } else {
        $('likedRows').insertAdjacentHTML('beforeend', rows);
      }
      wireTrackRowEvents(main);
      likedOffset += data.items.length;
      const wrap = main.querySelector('.load-more-wrap');
      wrap.innerHTML = '';
      if(data.next){
        const btn = document.createElement('button');
        btn.className = 'pill sm'; btn.textContent = 'Load more';
        btn.addEventListener('click', () => openLiked(false));
        wrap.appendChild(btn);
      }
    }catch(e){ main.innerHTML = `<div class="empty-state">Could not load Liked Songs: ${esc(e.message)}</div>`; }
  }

  function renderQueueView(){
    setActiveNav('queue');
    if(isPremium){
      main.innerHTML = `<h2 class="view-title">Queue</h2><p class="view-sub">Up next, from your active Spotify session.</p><div id="queueRows"><div class="empty-state">Play something to see what's next.</div></div>`;
    } else {
      const listId = registerList(localQueue, null);
      main.innerHTML = `<h2 class="view-title">Queue</h2><p class="view-sub">Free account — these open in Spotify when played. Tracks you add here stay in this list for reference.</p>` +
        (localQueue.length ? localQueue.map((t,i)=>trackRowHtml(t,i,listId)).join('') : `<div class="empty-state">Nothing queued yet — use the queue icon on any track.</div>`);
      wireTrackRowEvents(main);
    }
  }
  function renderQueueViewIfActive(nextTracks){
    if(currentView !== 'queue' || !isPremium) return;
    const rows = $('queueRows');
    if(!rows) return;
    if(!nextTracks.length){ rows.innerHTML = `<div class="empty-state">Nothing queued next.</div>`; return; }
    const listId = registerList(nextTracks, null);
    rows.innerHTML = nextTracks.map((t,i)=>trackRowHtml(t,i,listId)).join('');
    wireTrackRowEvents(rows);
  }

  function switchView(view){
    currentView = view;
    setActiveNav(view);
    if(view === 'search'){ $('searchInput').value=''; renderSearchEmpty(); }
    else if(view === 'liked'){ openLiked(); }
    else if(view === 'queue'){ renderQueueView(); }
  }

  document.querySelectorAll('.nav-item').forEach(btn => {
    btn.addEventListener('click', () => switchView(btn.dataset.view));
  });

  let searchDebounce;
  $('searchInput').addEventListener('input', (e) => {
    clearTimeout(searchDebounce);
    const q = e.target.value.trim();
    currentView = 'search';
    setActiveNav('search');
    searchDebounce = setTimeout(() => runSearch(q), 350);
  });

  async function loadPlaylists(){
    try{
      const data = await api('/me/playlists?limit=50');
      $('playlistList').innerHTML = data.items.map(p =>
        `<button class="playlist-item" data-id="${p.id}">${esc(p.name)}</button>`).join('');
      $('playlistList').querySelectorAll('.playlist-item').forEach(el => {
        el.addEventListener('click', () => openPlaylist(el.dataset.id));
      });
    }catch(e){ $('playlistList').innerHTML = `<div class="empty-state" style="padding:8px 14px;">Could not load playlists.</div>`; }
  }

  // ---------------- Player bar controls ----------------
  $('playBtn').addEventListener('click', () => { if(player) player.togglePlay(); });
  $('nextBtn').addEventListener('click', () => player && player.nextTrack());
  $('prevBtn').addEventListener('click', () => player && player.previousTrack());
  $('volSlider').addEventListener('input', (e) => { if(player) player.setVolume(Number(e.target.value)/100); });
  $('barTrack').addEventListener('click', (e) => {
    if(!player || !curDurationMs) return;
    const rect = e.currentTarget.getBoundingClientRect();
    const pct = (e.clientX-rect.left)/rect.width;
    const seekMs = Math.floor(pct*curDurationMs);
    player.seek(seekMs);
    curPositionMs = seekMs; updateBar();
  });
  $('logoutBtn').addEventListener('click', disconnect);
  $('connectBtn').addEventListener('click', beginLogin);

  // ---------------- Bootstrap ----------------
  async function showApp(){
    gate.classList.add('hidden');
    app.classList.add('show');
    try{
      const me = await api('/me');
      $('userTag').textContent = me.display_name || me.id;
    }catch(e){}
    $('acctBadge').textContent = 'Connecting…';
    initPlayer();
    loadPlaylists();
    renderSearchEmpty();
  }

  function showGate(){
    app.classList.remove('show');
    gate.classList.remove('hidden');
    const notice = $('setupNotice');
    if(!window.isSecureContext){
      notice.textContent = 'Not a secure context (' + window.location.protocol + '//) — host over https:// or http://localhost.';
      notice.classList.remove('hidden');
    } else if(!CLIENT_ID || CLIENT_ID==='YOUR_SPOTIFY_CLIENT_ID_HERE'){
      notice.textContent = 'Setup needed — redirect URI for the dashboard: ' + REDIRECT_URI;
      notice.classList.remove('hidden');
    } else {
      notice.classList.add('hidden');
    }
  }

  async function bootstrap(){
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code'), err = params.get('error');
    if(err){ showGate(); showGateError('Spotify login was cancelled or failed.'); return; }
    if(code){
      window.history.replaceState({}, document.title, REDIRECT_URI);
      try{ await exchangeCode(code); }
      catch(e){ showGate(); showGateError('Could not complete login — try again.'); return; }
      showApp();
      return;
    }
    const token = localStorage.getItem(LS.accessToken);
    if(token) showApp(); else showGate();
  }

  bootstrap();
})();
</script>
</body>
</html>
