<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="3;url=https://example.com">
  <title>ysxj — Redirecting...</title>
  <link rel="icon" type="image/png" href="ysxjlogo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Permanent+Marker&family=Barlow+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --ink:#0a0a0a;
      --ink-2:#151515;
      --paper:#f2f0e9;
      --paper-dim:#c9c7bd;
      --pink:#ff2f92;
    }

    * { box-sizing:border-box; }

    html, body {
      margin:0;
      width:100%;
      height:100%;
    }

    body {
      background:
        linear-gradient(180deg, rgba(10,10,10,.35), rgba(10,10,10,.82)),
        url('./assets/texture-bg.png');
      background-size:cover;
      background-position:center;
      color:var(--paper);
      font-family:'Barlow Condensed', sans-serif;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      overflow:hidden;
    }

    body::before {
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      background:
        radial-gradient(circle at 15% 20%, rgba(255,47,146,.08), transparent 25%),
        radial-gradient(circle at 85% 80%, rgba(255,47,146,.06), transparent 28%);
    }

    .redirect-card {
      position:relative;
      width:min(620px, calc(100% - 40px));
      padding:58px 35px 52px;
      background:rgba(21,21,21,.94);
      border:2px solid #292929;
      box-shadow:12px 12px 0 #ff2f92;
    }

    .tag {
      font-family:'Permanent Marker', cursive;
      color:var(--pink);
      font-size:20px;
      transform:rotate(-2deg);
      display:inline-block;
      margin-bottom:14px;
    }

    .logo {
      width:90px;
      height:90px;
      object-fit:contain;
      border-radius:50%;
      margin-bottom:20px;
      filter:drop-shadow(0 12px 20px rgba(0,0,0,.6));
    }

    h1 {
      margin:0;
      font-family:'Anton', sans-serif;
      font-size:clamp(55px, 10vw, 92px);
      line-height:.9;
      letter-spacing:1px;
      text-transform:uppercase;
      text-shadow:
        4px 0 0 var(--pink),
        -2px 0 0 var(--ink);
    }

    .subtitle {
      margin:22px auto 0;
      color:var(--paper-dim);
      font-size:21px;
      letter-spacing:.3px;
    }

    .loader {
      width:100%;
      max-width:390px;
      height:7px;
      margin:32px auto 18px;
      background:#303030;
      overflow:hidden;
      border:1px solid #444;
    }

    .loader span {
      display:block;
      height:100%;
      width:0;
      background:var(--pink);
      animation:load 3s linear forwards;
    }

    .small {
      color:#777;
      font-size:14px;
      text-transform:uppercase;
      letter-spacing:1px;
    }

    .corner {
      position:absolute;
      font-family:'Anton', sans-serif;
      color:#333;
      font-size:48px;
      line-height:1;
    }

    .corner.top-left { top:12px; left:16px; }
    .corner.bottom-right { bottom:8px; right:16px; }

    @keyframes load {
      from { width:0; }
      to { width:100%; }
    }

    @media (max-width:600px) {
      .redirect-card {
        padding:45px 24px 42px;
        box-shadow:7px 7px 0 var(--pink);
      }

      .logo {
        width:72px;
        height:72px;
      }
    }
  </style>
</head>

<body>
  <main class="redirect-card">
    <div class="corner top-left">01</div>
    <div class="corner bottom-right">YSXJ</div>

    <img class="logo" src="ysxjlogo.png" alt="ysxj logo">

    <div class="tag">// ysxj</div>
    <h1>Redirecting...</h1>
    <p class="subtitle">Taking you to the next page.</p>

    <div class="loader"><span></span></div>
    <div class="small">Please wait...</div>
  </main>

  <script>
    setTimeout(function () {
      window.location.replace("https://discord.gg/3hkfHPwc2t");
    }, 3000);
  </script>
</body>
</html>
