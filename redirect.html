<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="refresh" content="3;url=https://example.com">
<title>ysxj — Redirecting...</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Permanent+Marker&family=Barlow+Condensed:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0}
body{
  background:#0a0a0a;
  color:#f2f0e9;
  font-family:'Barlow Condensed',sans-serif;
  overflow:hidden;
}
body:before{
  content:"";
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at 15% 20%,rgba(255,47,146,.13),transparent 28%),
    radial-gradient(circle at 85% 80%,rgba(255,47,146,.08),transparent 30%),
    repeating-linear-gradient(135deg,rgba(255,255,255,.018) 0 1px,transparent 1px 8px);
  pointer-events:none;
}
.page{
  width:100vw;
  height:100vh;
  min-width:320px;
  min-height:180px;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
}
.background-text{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:'Anton',sans-serif;
  font-size:min(32vw,620px);
  color:#111;
  letter-spacing:-15px;
  user-select:none;
  pointer-events:none;
}
.card{
  position:relative;
  z-index:2;
  width:min(900px,80vw);
  min-height:520px;
  padding:70px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  background:rgba(15,15,15,.96);
  border:2px solid #292929;
  box-shadow:22px 22px 0 #ff2f92;
}
.tag{
  font-family:'Permanent Marker',cursive;
  color:#ff2f92;
  font-size:32px;
  transform:rotate(-3deg);
  margin-bottom:20px;
}
.logo{
  width:115px;
  height:115px;
  object-fit:contain;
  border-radius:50%;
  margin-bottom:25px;
}
h1{
  margin:0;
  font-family:'Anton',sans-serif;
  font-size:clamp(80px,8vw,145px);
  line-height:.86;
  text-transform:uppercase;
  letter-spacing:2px;
  text-shadow:6px 0 #ff2f92,-3px 0 #050505;
}
.subtitle{
  margin:30px 0 0;
  color:#bdbbb3;
  font-size:27px;
}
.loader{
  width:min(600px,75%);
  height:10px;
  margin-top:40px;
  background:#292929;
  border:1px solid #444;
}
.loader span{
  display:block;
  width:0;
  height:100%;
  background:#ff2f92;
  animation:load 3s linear forwards;
}
.small{
  margin-top:16px;
  color:#666;
  font-size:17px;
  text-transform:uppercase;
  letter-spacing:3px;
}
.mark{
  position:absolute;
  color:#333;
  font-family:'Anton',sans-serif;
  font-size:55px;
}
.tl{top:25px;left:30px}
.br{right:30px;bottom:20px}
@keyframes load{to{width:100%}}
@media(max-width:800px){
 .card{width:86vw;min-height:60vh;padding:40px;box-shadow:12px 12px 0 #ff2f92}
 .logo{width:80px;height:80px}
 .tag{font-size:22px}
 .subtitle{font-size:20px}
 .loader{width:90%}
}
</style>
</head>
<body>
<div class="page">
  <div class="background-text">YSXJ</div>
  <main class="card">
    <div class="mark tl">01</div>
    <div class="mark br">YSXJ</div>
    <img class="logo" src="ysxjlogo.png" alt="ysxj">
    <div class="tag">// ysxj</div>
    <h1>Redirecting...</h1>
    <p class="subtitle">You're being redirected to the next page.</p>
    <div class="loader"><span></span></div>
    <div class="small">Please wait</div>
  </main>
</div>
<script>
setTimeout(() => window.location.replace("https://discord.gg/3hkfHPwc2t"), 3000);
</script>
</body>
</html>
