<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="refresh" content="3;url=https://discord.gg/3hkfHPwc2t">
<title>ysxj — Redirecting…</title>
<meta name="description" content="You're being redirected to the ysxj support server on Discord.">
<link rel="icon" type="image/png" href="ysxjlogo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#101012;
    --ink-2:#1a1a1d;
    --ink-3:#232327;
    --paper:#f7f5ef;
    --paper-dim:#c9c7bd;
    --paper-faint:#8c8a80;
    --line: rgba(247,245,239,0.14);
    --line-strong: rgba(247,245,239,0.28);
  }
  *{box-sizing:border-box;}
  html,body{ width:100%; height:100%; margin:0; }
  body{
    background:var(--ink);
    color:var(--paper);
    font-family:'Nunito', sans-serif;
    font-weight:600;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  a{ color:inherit; }
  a:focus-visible, button:focus-visible{ outline:3px solid var(--paper); outline-offset:2px; border-radius:8px; }
  @media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important; } }

  .page{
    width:100%; height:100%; position:relative;
    display:flex; align-items:center; justify-content:center;
    padding:24px;
  }

  /* faint oversized wordmark, same device the main site uses for texture */
  .backdrop{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:'Fredoka', sans-serif; font-weight:600;
    font-size:min(30vw, 520px); color:var(--ink-2);
    letter-spacing:-6px; user-select:none; pointer-events:none; z-index:0;
  }

  .card{
    position:relative; z-index:1;
    width:min(480px, 100%);
    background:var(--ink-2); border:2px solid var(--line-strong); border-radius:32px;
    padding:48px 40px 40px;
    display:flex; flex-direction:column; align-items:center; text-align:center;
  }

  .brand{ display:flex; align-items:center; gap:10px; margin-bottom:28px; }
  .dot-logo{ width:40px; height:40px; border-radius:50%; background:var(--paper); display:flex; align-items:center; justify-content:center; }
  .dot-logo span{ width:12px; height:12px; background:var(--ink); border-radius:50%; }
  .brand-name{ font-family:'Fredoka', sans-serif; font-size:22px; font-weight:600; }

  .status-chip{
    display:inline-flex; align-items:center; gap:8px;
    font-family:'JetBrains Mono', monospace; font-size:12px; letter-spacing:0.5px; text-transform:uppercase;
    color:var(--paper-dim); border:1.5px solid var(--line-strong); padding:7px 16px 7px 10px; border-radius:999px;
    margin-bottom:22px;
  }
  .status-chip .dot{ width:8px; height:8px; border-radius:50%; background:var(--paper); animation:pulse 1.4s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.35;} }

  h1{
    margin:0; font-family:'Fredoka', sans-serif; font-weight:600;
    font-size:clamp(32px, 5vw, 44px); line-height:1.05;
  }
  .subtitle{
    margin:14px 0 0; color:var(--paper-dim); font-size:17px; font-weight:600; max-width:340px;
  }

  .loader{
    width:100%; height:8px; margin-top:32px;
    background:var(--ink-3); border-radius:999px; overflow:hidden;
  }
  .loader span{ display:block; width:0; height:100%; background:var(--paper); border-radius:999px; animation:load 3s linear forwards; }
  @keyframes load{ to{ width:100%; } }

  .fallback{
    margin-top:26px; font-family:'JetBrains Mono', monospace; font-size:12.5px; color:var(--paper-faint);
  }
  .fallback a{ color:var(--paper-dim); text-decoration:underline; }
  .fallback a:hover{ color:var(--paper); }
</style>
</head>
<body>

<div class="page">
  <div class="backdrop" aria-hidden="true">ysxj</div>
  <main class="card">
    <div class="brand">
      <span class="dot-logo"><span></span></span>
      <span class="brand-name">ysxj</span>
    </div>
    <span class="status-chip"><span class="dot"></span>Redirecting</span>
    <h1>Taking you to the support server</h1>
    <p class="subtitle">Hang tight — you'll land on Discord in a moment.</p>
    <div class="loader"><span></span></div>
    <p class="fallback">Nothing happening? <a href="https://discord.gg/3hkfHPwc2t">Continue manually →</a></p>
  </main>
</div>

<script>
  setTimeout(() => window.location.replace("https://discord.gg/3hkfHPwc2t"), 3000);
</script>

</body>
</html>
